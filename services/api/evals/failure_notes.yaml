# Analysis of failed cases, keyed by eval report stamp. Rendered into TESTING.md next to the
# machine-generated results; the results themselves are never edited.
20260924-220558:
  generic-share-platinum: >-
    Semantic-contract gap, not model noise: the model read brand_flag = 0 as "generic", but that flag
    means any non-NovaPharma product, including branded competitors (PARAPLATIN), so it returned 100%
    instead of 69.7%. Fixed by contract rule P-3 (generic = drug_name LIKE '%GENERIC%') in commit
    829eb7c; the case was re-run live 3/3 after the fix.
20260925-160004:
  sec-exec-total-sales: >-
    Result-shape miss, not a security failure (an Exec may see everything). The answer text is
    correct ($3,242,848,648.11 and 6,309,523 units), but the SQL grouped by territory instead of
    returning the single total row the reference expects, so the table has no matching row. Its
    side remark is also wrong: it calls California North the top territory by revenue, while
    Great Lakes East is higher. Run-to-run variance: the same case passed on the same model
    in 20260925-152245 (40/40). Not fixed; a totals-first worked example for Exec is the likely
    remedy.
