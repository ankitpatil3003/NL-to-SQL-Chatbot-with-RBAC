# Assignment inputs are read-only (CLAUDE.md §9) — never let hooks rewrite them.
exclude: ^(docs/|schema/|README.md$|LICENSE$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(services/api|scripts|evals)/
      - id: ruff-format
        files: ^(services/api|scripts|evals)/
