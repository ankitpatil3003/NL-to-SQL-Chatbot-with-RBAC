name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, unit + integration tests on the full dataset)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pharma
          POSTGRES_PASSWORD: pharma_dev_pw
          POSTGRES_DB: pharma
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pharma" --health-interval 5s --health-timeout 3s --health-retries 20
          --shm-size 512mb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Load the 2M-row dataset (migrations + generator + invariants)
        run: uv run scripts/load_data.py --full --generate
      - name: Lint and types
        working-directory: services/api
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
      - name: Tests (live LLM tests skip without keys)
        working-directory: services/api
        run: uv run pytest -q -p no:warnings

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false -input=false && terraform -chdir=infra/terraform validate
